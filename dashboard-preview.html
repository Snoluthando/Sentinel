<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrimeNet SA — Operator Dashboard Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #080C18;
    --surface: #0D1220;
    --surface2: #111827;
    --border: rgba(255,255,255,0.08);
    --red: #EF4444;
    --orange: #F97316;
    --yellow: #EAB308;
    --blue: #3B82F6;
    --green: #10B981;
    --purple: #8B5CF6;
    --text: #E2E8F0;
    --text-dim: rgba(255,255,255,0.4);
    --text-muted: rgba(255,255,255,0.2);
  }

  body {
    font-family: 'IBM Plex Mono', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ─── TOPBAR ─────────────────────────────────────────────────── */
  .topbar {
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    flex-shrink: 0;
    z-index: 10;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-icon {
    width: 28px;
    height: 28px;
    background: rgba(239,68,68,0.2);
    border: 1px solid rgba(239,68,68,0.4);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }

  .logo-text { font-size: 13px; font-weight: 700; letter-spacing: 3px; color: var(--red); }
  .logo-sub { font-size: 9px; color: var(--text-muted); letter-spacing: 2px; }

  .spacer { flex: 1; }

  .live-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 8px;
    background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.25);
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    color: var(--green);
    cursor: pointer;
    transition: all 0.2s;
  }

  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.5s infinite; }

  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.2)} }
  @keyframes slide-in { from{transform:translateX(-100%);opacity:0} to{transform:translateX(0);opacity:1} }
  @keyframes flash { 0%{background:rgba(239,68,68,0.3)} 100%{background:transparent} }

  .time-badge {
    font-size: 11px; color: var(--text-dim);
    border-left: 1px solid var(--border);
    padding-left: 12px;
  }

  .user-badge {
    display: flex; align-items: center; gap: 8px;
    border-left: 1px solid var(--border);
    padding-left: 12px;
  }

  .user-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(59,130,246,0.2);
    border: 1px solid rgba(59,130,246,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: var(--blue);
  }

  .user-name { font-size: 11px; color: var(--text-dim); }

  /* ─── LAYOUT ─────────────────────────────────────────────────── */
  .layout { display: flex; flex: 1; overflow: hidden; }

  /* ─── SIDEBAR ────────────────────────────────────────────────── */
  .sidebar {
    width: 300px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat-cell {
    background: var(--surface);
    padding: 12px;
  }

  .stat-label {
    font-size: 8px; letter-spacing: 2px; color: var(--text-muted);
    display: flex; align-items: center; gap: 4px;
    margin-bottom: 4px;
  }

  .stat-label svg { opacity: 0.5; }

  .stat-value { font-size: 22px; font-weight: 700; }

  .stat-value.red { color: var(--red); }
  .stat-value.blue { color: var(--blue); }
  .stat-value.orange { color: var(--orange); }
  .stat-value.green { color: var(--green); }

  /* Filters */
  .filters {
    display: flex; gap: 4px; padding: 8px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }

  .filter-btn {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 9px; letter-spacing: 1px;
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--text-muted);
    transition: all 0.15s;
    white-space: nowrap;
    font-weight: 600;
  }

  .filter-btn.active { background: rgba(255,255,255,0.08); color: var(--text); }
  .filter-btn:hover { color: var(--text-dim); }

  /* Incident list */
  .incident-list {
    flex: 1;
    overflow-y: auto;
  }

  .incident-list::-webkit-scrollbar { width: 4px; }
  .incident-list::-webkit-scrollbar-track { background: transparent; }
  .incident-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .incident-item {
    border-bottom: 1px solid var(--border);
    padding: 10px 12px;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  .incident-item:hover { background: rgba(255,255,255,0.03); }
  .incident-item.selected { background: rgba(255,255,255,0.05); border-left: 2px solid var(--blue); }
  .incident-item.new-flash { animation: flash 1s ease-out; }

  .inc-icon { font-size: 18px; margin-top: 1px; flex-shrink: 0; }

  .inc-body { flex: 1; min-width: 0; }

  .inc-badges { display: flex; gap: 4px; margin-bottom: 3px; flex-wrap: wrap; }

  .badge {
    font-size: 8px; padding: 1px 5px; border-radius: 4px;
    border: 1px solid; font-weight: 700; letter-spacing: 0.5px;
  }

  .badge-cat { }
  .badge-status { }
  .badge-pending { background: rgba(234,179,8,0.1); border-color: rgba(234,179,8,0.3); color: #EAB308; }
  .badge-verified { background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.3); color: var(--blue); }
  .badge-investigating { background: rgba(249,115,22,0.1); border-color: rgba(249,115,22,0.3); color: var(--orange); }
  .badge-resolved { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: var(--green); }

  .inc-title {
    font-size: 11px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-bottom: 3px;
  }

  .inc-meta {
    font-size: 9px; color: var(--text-muted);
    display: flex; gap: 6px; align-items: center;
  }

  /* ─── MAP AREA ────────────────────────────────────────────────── */
  .map-area { flex: 1; position: relative; background: #0B1220; overflow: hidden; }

  /* Simulated map */
  .map-bg {
    position: absolute; inset: 0;
    background:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .map-roads {
    position: absolute; inset: 0;
    overflow: hidden;
  }

  .road {
    position: absolute;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
  }

  /* Map markers */
  .map-marker {
    position: absolute;
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.2s;
    z-index: 2;
    transform: translate(-50%, -50%);
  }

  .map-marker:hover { transform: translate(-50%, -50%) scale(1.3); z-index: 10; }
  .map-marker.new-marker { animation: pop-in 0.4s cubic-bezier(0.34,1.56,0.64,1); }

  @keyframes pop-in {
    from { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }

  /* Hotspot circle */
  .hotspot-circle {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid;
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: hotspot-pulse 3s ease-in-out infinite;
  }

  @keyframes hotspot-pulse {
    0%,100% { opacity: 0.3; }
    50% { opacity: 0.6; }
  }

  /* Detail panel */
  .detail-panel {
    position: absolute;
    top: 16px; right: 16px;
    width: 280px;
    background: rgba(13,18,32,0.95);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    z-index: 20;
    animation: slide-in 0.2s ease;
  }

  .panel-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .panel-icon { font-size: 24px; }
  .panel-category { font-size: 9px; color: var(--text-muted); letter-spacing: 2px; }
  .panel-title { font-size: 13px; font-weight: 700; margin-top: 2px; }
  .close-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 0; transition: color 0.15s; }
  .close-btn:hover { color: var(--text); }

  .panel-desc { font-size: 11px; color: var(--text-dim); margin-bottom: 12px; line-height: 1.6; }

  .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }

  .panel-cell {
    background: rgba(255,255,255,0.04);
    border-radius: 8px; padding: 8px;
  }

  .panel-cell-label { font-size: 8px; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 3px; }
  .panel-cell-value { font-size: 12px; font-weight: 600; }

  .panel-actions { display: flex; gap: 6px; }

  .action-btn {
    flex: 1; padding: 8px; border-radius: 8px;
    border: 1px solid; font-size: 10px; font-weight: 700;
    letter-spacing: 0.5px; cursor: pointer; font-family: inherit;
    transition: all 0.15s;
  }

  .action-btn.dispatch {
    background: rgba(59,130,246,0.1);
    border-color: rgba(59,130,246,0.3);
    color: var(--blue);
  }

  .action-btn.resolve {
    background: rgba(16,185,129,0.1);
    border-color: rgba(16,185,129,0.3);
    color: var(--green);
  }

  .action-btn:hover { filter: brightness(1.2); }

  /* Legend */
  .legend {
    position: absolute;
    bottom: 24px; right: 16px;
    background: rgba(13,18,32,0.9);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    font-size: 10px;
    z-index: 5;
  }

  .legend-title { font-size: 8px; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 8px; }
  .legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; color: var(--text-dim); }

  /* Scale bar */
  .scale-bar {
    position: absolute;
    bottom: 24px; left: 16px;
    font-size: 9px; color: var(--text-muted);
  }

  .scale-line {
    height: 3px; width: 80px;
    background: linear-gradient(90deg, transparent, var(--text-muted));
    margin-bottom: 3px;
    border-radius: 2px;
  }

  /* Alert toast */
  .alert-toast {
    position: fixed;
    top: 64px; right: 16px;
    background: rgba(239,68,68,0.15);
    border: 1px solid rgba(239,68,68,0.4);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 11px;
    z-index: 100;
    display: flex; gap: 8px; align-items: center;
    animation: toast-in 0.3s ease;
    max-width: 280px;
  }

  @keyframes toast-in {
    from { transform: translateY(-20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .toast-icon { font-size: 16px; }
  .toast-title { font-weight: 700; color: var(--red); font-size: 10px; }
  .toast-body { color: var(--text-dim); font-size: 10px; }

  /* Empty list state */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 120px;
    color: var(--text-muted); font-size: 11px; gap: 6px;
  }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">
    <div class="logo-icon">🚔</div>
    <div>
      <div class="logo-text">CRIMENET</div>
      <div class="logo-sub">SA OPS</div>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="live-badge" onclick="toggleLive()">
    <div class="live-dot" id="live-dot"></div>
    <span id="live-label">LIVE</span>
  </div>

  <div class="time-badge" id="clock">--:--:--</div>

  <div class="user-badge">
    <div class="user-avatar">AR</div>
    <div class="user-name">Protea Armed Response</div>
  </div>
</div>

<!-- MAIN LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-cell">
        <div class="stat-label">⚡ TODAY</div>
        <div class="stat-value red" id="stat-total">0</div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">✓ VERIFIED</div>
        <div class="stat-value blue" id="stat-verified">0</div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">🔥 HOTSPOTS</div>
        <div class="stat-value orange" id="stat-hotspots">3</div>
      </div>
      <div class="stat-cell">
        <div class="stat-label">📡 COVERAGE</div>
        <div class="stat-value green">87%</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">ALL</button>
      <button class="filter-btn" onclick="setFilter('verified', this)">VERIFIED</button>
      <button class="filter-btn" onclick="setFilter('pending', this)">PENDING</button>
      <button class="filter-btn" onclick="setFilter('investigating', this)">ACTIVE</button>
    </div>

    <!-- Incident list -->
    <div class="incident-list" id="incident-list">
      <div class="empty-state">⏳ Loading incidents...</div>
    </div>

  </div>

  <!-- MAP AREA -->
  <div class="map-area" id="map">
    <!-- Grid bg -->
    <div class="map-bg"></div>

    <!-- Simulated roads -->
    <div class="map-roads" id="roads"></div>

    <!-- Markers will be injected here -->

    <!-- Hotspot circles -->
    <div class="hotspot-circle" style="left:45%;top:38%;width:180px;height:180px;border-color:rgba(239,68,68,0.5);background:rgba(239,68,68,0.05);"></div>
    <div class="hotspot-circle" style="left:68%;top:62%;width:120px;height:120px;border-color:rgba(249,115,22,0.4);background:rgba(249,115,22,0.04);animation-delay:1.5s;"></div>
    <div class="hotspot-circle" style="left:28%;top:65%;width:90px;height:90px;border-color:rgba(234,179,8,0.4);background:rgba(234,179,8,0.04);animation-delay:0.7s;"></div>

    <!-- Detail panel (hidden by default) -->
    <div class="detail-panel" id="detail-panel" style="display:none">
      <div class="panel-header">
        <div>
          <div class="panel-icon" id="panel-icon">🔫</div>
          <div class="panel-category" id="panel-category">ROBBERY</div>
          <div class="panel-title" id="panel-title">—</div>
        </div>
        <button class="close-btn" onclick="closePanel()">×</button>
      </div>
      <div class="panel-desc" id="panel-desc">—</div>
      <div class="panel-grid">
        <div class="panel-cell">
          <div class="panel-cell-label">STATUS</div>
          <div class="panel-cell-value" id="panel-status">—</div>
        </div>
        <div class="panel-cell">
          <div class="panel-cell-label">CONFIRMS</div>
          <div class="panel-cell-value blue" id="panel-confirms">—</div>
        </div>
        <div class="panel-cell">
          <div class="panel-cell-label">REPORTED</div>
          <div class="panel-cell-value" id="panel-time">—</div>
        </div>
        <div class="panel-cell">
          <div class="panel-cell-label">AREA</div>
          <div class="panel-cell-value" id="panel-area">—</div>
        </div>
      </div>
      <div class="panel-actions">
        <button class="action-btn dispatch" onclick="simulateDispatch()">🚔 Dispatch</button>
        <button class="action-btn resolve" onclick="simulateResolve()">✓ Resolve</button>
      </div>
    </div>

    <!-- Legend -->
    <div class="legend" id="legend">
      <div class="legend-title">INCIDENT TYPES</div>
      <div class="legend-item">🔫 Robbery</div>
      <div class="legend-item">👜 Theft</div>
      <div class="legend-item">🏠 Burglary</div>
      <div class="legend-item">🚗 Vehicle Theft</div>
      <div class="legend-item">👁️ Suspicious</div>
      <div class="legend-item">⚠️ Assault</div>
    </div>

    <!-- Scale -->
    <div class="scale-bar">
      <div class="scale-line"></div>
      <div>500m · Fourways, JHB</div>
    </div>
  </div>

</div>

<script>
  // ─── DATA ───────────────────────────────────────────────────────────────────
  const CATEGORIES = {
    robbery:            { color: '#EF4444', icon: '🔫', label: 'Robbery' },
    theft:              { color: '#F97316', icon: '👜', label: 'Theft' },
    burglary:           { color: '#EAB308', icon: '🏠', label: 'Burglary' },
    vehicle_theft:      { color: '#8B5CF6', icon: '🚗', label: 'Vehicle Theft' },
    assault:            { color: '#DC2626', icon: '⚠️', label: 'Assault' },
    suspicious_activity:{ color: '#3B82F6', icon: '👁️', label: 'Suspicious' },
    vandalism:          { color: '#6B7280', icon: '🔨', label: 'Vandalism' },
    drug_activity:      { color: '#10B981', icon: '💊', label: 'Drug Activity' },
  };

  const STATUS_CLASS = {
    pending: 'badge-pending',
    verified: 'badge-verified',
    investigating: 'badge-investigating',
    resolved: 'badge-resolved',
  };

  const AREAS = ['Fourways', 'Sandton', 'Randburg', 'Bryanston', 'Midrand', 'Rivonia'];

  let incidents = [];
  let selectedId = null;
  let activeFilter = 'all';
  let isLive = true;
  let simulationInterval = null;

  function makeIncident(overrides = {}) {
    const cats = Object.keys(CATEGORIES);
    const statuses = ['pending','pending','verified','verified','investigating','resolved'];
    const cat = overrides.category || cats[Math.floor(Math.random() * cats.length)];
    const catInfo = CATEGORIES[cat];

    const titles = {
      robbery: ['Armed robbery at shopping centre', 'Robbery at ATM', 'Mugging on main road'],
      theft:   ['Phone snatching at traffic light', 'Pickpocketing at mall', 'Laptop stolen from car'],
      burglary:['House break-in on elm street', 'Garage door forced open', 'Smash and grab'],
      vehicle_theft: ['Vehicle hijacking reported', 'Car stolen from driveway', 'Catalytic converter theft'],
      assault: ['Assault outside club', 'Road rage incident', 'Domestic assault reported'],
      suspicious_activity: ['Suspicious vehicle circling', 'Unknown persons casing houses', 'Suspicious loitering'],
      vandalism: ['Graffiti sprayed on walls', 'Car window smashed', 'Gate damaged'],
      drug_activity: ['Drug deal witnessed', 'Suspicious packages seen', 'Drug use in park'],
    };

    const titleList = titles[cat] || [`${catInfo.label} incident reported`];

    const now = Date.now();
    const minutesAgo = Math.floor(Math.random() * 180);
    const time = new Date(now - minutesAgo * 60000);

    return {
      id: 'inc-' + Math.random().toString(36).substr(2,9),
      category: cat,
      title: titleList[Math.floor(Math.random() * titleList.length)],
      description: 'Multiple witnesses reported the incident. Officers notified.',
      status: overrides.status || statuses[Math.floor(Math.random() * statuses.length)],
      created_at: time.toISOString(),
      confirmation_count: Math.floor(Math.random() * 4) + 1,
      area: AREAS[Math.floor(Math.random() * AREAS.length)],
      // Map position (percentage of map container)
      mapX: 15 + Math.random() * 70,
      mapY: 15 + Math.random() * 70,
      ...overrides,
    };
  }

  // ─── TIME ────────────────────────────────────────────────────────────────────
  function timeAgo(isoString) {
    const diff = (Date.now() - new Date(isoString).getTime()) / 1000;
    if (diff < 60) return `${Math.round(diff)}s ago`;
    if (diff < 3600) return `${Math.round(diff/60)}m ago`;
    if (diff < 86400) return `${Math.round(diff/3600)}h ago`;
    return `${Math.round(diff/86400)}d ago`;
  }

  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-ZA', { hour12: false });
  }

  // ─── FILTER ──────────────────────────────────────────────────────────────────
  function setFilter(f, btn) {
    activeFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderList();
  }

  // ─── RENDER LIST ─────────────────────────────────────────────────────────────
  function renderList() {
    const list = document.getElementById('incident-list');
    const filtered = activeFilter === 'all'
      ? incidents
      : incidents.filter(i => i.status === activeFilter || i.category === activeFilter);

    if (!filtered.length) {
      list.innerHTML = '<div class="empty-state">📭 No incidents in filter</div>';
      return;
    }

    list.innerHTML = filtered.map(inc => {
      const cat = CATEGORIES[inc.category] || CATEGORIES.robbery;
      return `
        <div class="incident-item ${selectedId === inc.id ? 'selected' : ''}" id="li-${inc.id}" onclick="selectIncident('${inc.id}')">
          <div class="inc-icon">${cat.icon}</div>
          <div class="inc-body">
            <div class="inc-badges">
              <span class="badge badge-cat" style="color:${cat.color};background:${cat.color}18;border-color:${cat.color}40">${cat.label}</span>
              <span class="badge badge-status ${STATUS_CLASS[inc.status] || ''}">${inc.status.replace('_',' ').toUpperCase()}</span>
            </div>
            <div class="inc-title">${inc.title}</div>
            <div class="inc-meta">
              <span>🕐 ${timeAgo(inc.created_at)}</span>
              <span>·</span>
              <span>✓ ${inc.confirmation_count}</span>
              <span>·</span>
              <span>${inc.area}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  // ─── STATS ────────────────────────────────────────────────────────────────────
  function updateStats() {
    const today = incidents.filter(i => {
      const d = new Date(i.created_at);
      const now = new Date();
      return d.toDateString() === now.toDateString();
    });
    document.getElementById('stat-total').textContent = today.length;
    document.getElementById('stat-verified').textContent = today.filter(i => i.status === 'verified').length;
  }

  // ─── MAP MARKERS ─────────────────────────────────────────────────────────────
  function addMarker(inc, animate = false) {
    const map = document.getElementById('map');
    const cat = CATEGORIES[inc.category] || CATEGORIES.robbery;

    const el = document.createElement('div');
    el.className = 'map-marker' + (animate ? ' new-marker' : '');
    el.id = 'marker-' + inc.id;
    el.innerHTML = cat.icon;
    el.style.cssText = `
      left:${inc.mapX}%;top:${inc.mapY}%;
      background:${cat.color}20;
      border:2px solid ${cat.color};
    `;
    el.onclick = () => selectIncident(inc.id);
    map.appendChild(el);
  }

  function removeMarker(id) {
    const el = document.getElementById('marker-' + id);
    if (el) el.remove();
  }

  // ─── SELECT ──────────────────────────────────────────────────────────────────
  function selectIncident(id) {
    selectedId = id;
    const inc = incidents.find(i => i.id === id);
    if (!inc) return;

    const cat = CATEGORIES[inc.category] || CATEGORIES.robbery;

    document.getElementById('panel-icon').textContent = cat.icon;
    document.getElementById('panel-category').textContent = cat.label.toUpperCase();
    document.getElementById('panel-title').textContent = inc.title;
    document.getElementById('panel-desc').textContent = inc.description;
    document.getElementById('panel-status').textContent = inc.status.replace('_',' ').toUpperCase();
    document.getElementById('panel-status').className = 'panel-cell-value';
    const statusColors = { pending:'yellow', verified:'#3B82F6', investigating:'orange', resolved:'#10B981' };
    document.getElementById('panel-status').style.color = statusColors[inc.status] || '#fff';
    document.getElementById('panel-confirms').textContent = inc.confirmation_count;
    document.getElementById('panel-time').textContent = timeAgo(inc.created_at);
    document.getElementById('panel-area').textContent = inc.area;

    const legend = document.getElementById('legend');
    legend.style.display = 'none';

    document.getElementById('detail-panel').style.display = 'block';

    // Hide legend when panel is visible
    renderList();
  }

  function closePanel() {
    selectedId = null;
    document.getElementById('detail-panel').style.display = 'none';
    document.getElementById('legend').style.display = 'block';
    renderList();
  }

  // ─── DISPATCH/RESOLVE ────────────────────────────────────────────────────────
  function simulateDispatch() {
    const inc = incidents.find(i => i.id === selectedId);
    if (!inc) return;
    inc.status = 'investigating';
    document.getElementById('panel-status').textContent = 'INVESTIGATING';
    document.getElementById('panel-status').style.color = '#F97316';
    showToast('🚔', 'Unit Dispatched', `Unit responding to ${inc.area} incident`);
    renderList();
    updateStats();
  }

  function simulateResolve() {
    const inc = incidents.find(i => i.id === selectedId);
    if (!inc) return;
    inc.status = 'resolved';
    showToast('✅', 'Incident Resolved', 'Marked as resolved by operator');
    closePanel();
    renderList();
    updateStats();
  }

  // ─── TOAST ───────────────────────────────────────────────────────────────────
  function showToast(icon, title, body) {
    const toast = document.createElement('div');
    toast.className = 'alert-toast';
    toast.innerHTML = `<div class="toast-icon">${icon}</div><div><div class="toast-title">${title}</div><div class="toast-body">${body}</div></div>`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
  }

  // ─── LIVE SIMULATION ─────────────────────────────────────────────────────────
  function toggleLive() {
    isLive = !isLive;
    document.getElementById('live-dot').style.animation = isLive ? 'pulse 1.5s infinite' : 'none';
    document.getElementById('live-dot').style.background = isLive ? '#10B981' : '#6B7280';
    document.getElementById('live-label').textContent = isLive ? 'LIVE' : 'PAUSED';
    document.querySelector('.live-badge').style.background = isLive ? 'rgba(16,185,129,0.1)' : 'rgba(255,255,255,0.05)';

    if (isLive) startSimulation();
    else stopSimulation();
  }

  function addLiveIncident() {
    if (!isLive) return;
    const inc = makeIncident({ status: 'pending' });
    incidents.unshift(inc);
    addMarker(inc, true);

    // Flash list item
    renderList();
    updateStats();

    setTimeout(() => {
      const li = document.getElementById('li-' + inc.id);
      if (li) li.classList.add('new-flash');
      setTimeout(() => li && li.classList.remove('new-flash'), 1000);
    }, 50);

    showToast(CATEGORIES[inc.category].icon, 'New Incident', inc.title + ' — ' + inc.area);

    // Auto-verify some after 10s
    if (Math.random() > 0.4) {
      setTimeout(() => {
        inc.status = 'verified';
        inc.confirmation_count += 1;
        renderList();
        updateStats();
      }, 10000);
    }
  }

  function startSimulation() {
    simulationInterval = setInterval(addLiveIncident, 8000 + Math.random() * 12000);
  }

  function stopSimulation() {
    clearInterval(simulationInterval);
  }

  // ─── ROADS ───────────────────────────────────────────────────────────────────
  function drawRoads() {
    const roads = document.getElementById('roads');
    const roadDefs = [
      { top: '35%', left: 0, width: '100%', height: '3px' },
      { top: '60%', left: 0, width: '100%', height: '2px' },
      { top: '20%', left: 0, width: '100%', height: '2px' },
      { top: '75%', left: 0, width: '100%', height: '2px' },
      { left: '25%', top: 0, height: '100%', width: '3px' },
      { left: '50%', top: 0, height: '100%', width: '2px' },
      { left: '75%', top: 0, height: '100%', width: '2px' },
    ];

    roadDefs.forEach(r => {
      const d = document.createElement('div');
      d.className = 'road';
      Object.assign(d.style, r);
      roads.appendChild(d);
    });
  }

  // ─── INIT ────────────────────────────────────────────────────────────────────
  function init() {
    drawRoads();

    // Seed with initial incidents
    for (let i = 0; i < 12; i++) {
      const inc = makeIncident();
      incidents.push(inc);
      addMarker(inc);
    }

    renderList();
    updateStats();
    updateClock();
    setInterval(updateClock, 1000);
    setInterval(renderList, 30000); // refresh time-ago labels

    startSimulation();
  }

  init();
</script>
</body>
</html>
