# Render Blueprint — Railway replacement
# https://render.com/docs/blueprint-spec
# Dashboard: New → Blueprint → connect repo, path: files/render.yaml

services:
  - type: web
    name: sentinel-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npx ts-node src/main.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_API_KEY
        generateValue: true

  - type: web
    name: sentinel-ai
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_SERVICE_API_KEY
        sync: false
